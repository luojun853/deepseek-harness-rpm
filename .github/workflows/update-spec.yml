name: Update spec from upstream pre-release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific upstream pre-release version (e.g. 0.2.1-rc.5); leave empty to auto-detect"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-spec
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  UPSTREAM_PACKAGE: "@deepseek-ai/dsh"
  SPEC_FILE: deepseek-harness-bin.spec
  README_FILE: README.md

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve upstream pre-release
        id: upstream
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            tag="$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=100" \
              | jq -r '[.[] | select(.prerelease == true and .draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')"
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "No upstream pre-release found" >&2
              exit 1
            fi
          fi
          version="${version#dsh-v}"
          version="${version#v}"
          case "$version" in
            *-*) ;;
            *) echo "Version '$version' is not a pre-release" >&2; exit 1 ;;
          esac
          npm view "${UPSTREAM_PACKAGE}@${version}" version >/dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update spec and changelog
        id: update
        shell: bash
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          current="$(awk '$1 == "%global" && $2 == "npmver" { print $3; exit }' "$SPEC_FILE")"
          if [ -z "$current" ]; then
            echo "Could not determine current npm version from $SPEC_FILE" >&2
            exit 1
          fi

          changed=false
          release=false
          if [ "$current" = "$VERSION" ]; then
            release=true
          elif [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            python3 scripts/update_spec.py \
              --spec "$SPEC_FILE" \
              --readme "$README_FILE" \
              --version "$VERSION"
            git diff --check
            git diff -- "$SPEC_FILE" "$README_FILE"
            changed=true
            release=true
          else
            echo "Current version $current is newer than upstream $VERSION; skipping."
          fi

          {
            echo "changed=$changed"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Commit spec update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_FILE" "$README_FILE"
          git commit -m "Update to upstream pre-release ${{ steps.upstream.outputs.version }}"
          git push

      - name: Create GitHub release
        if: steps.update.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "deepseek-harness-bin ${VERSION}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git push origin "refs/tags/$tag"
          fi

          {
            echo "Automated package release for upstream pre-release ${VERSION}."
            echo
            echo "Upstream release: https://github.com/${UPSTREAM_REPO}/releases/tag/dsh-v${VERSION}"
            echo "Spec: https://github.com/${GITHUB_REPOSITORY}/blob/master/${SPEC_FILE}"
          } > release-notes.md

          gh release create "$tag" "$SPEC_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "deepseek-harness-bin ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
